plugins { id 'com.android.application' }
android {
 namespace 'dev.finsec.qa.network'
 compileSdk 35
 buildToolsVersion '35.0.0'
 defaultConfig { applicationId 'dev.finsec.qa.network'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 if (project.hasProperty('qaAssets')) { sourceSets.main.assets.srcDirs = [project.property('qaAssets')] }
}

