plugins { id 'com.android.application' }
def standaloneQa = project.hasProperty('standaloneQa') || project.hasProperty('standaloneCanvas')
android {
    namespace standaloneQa ? 'dev.finsec.qa.standalone' : 'dev.finsec.poc'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId project.hasProperty('standaloneCanvas') ? 'dev.finsec.qa.canvas' : (standaloneQa ? 'dev.finsec.qa.standalone' : 'dev.finsec.poc')
        minSdk 26
        targetSdk 28 // Fixed legacy inset geometry for this isolated synthetic fixture.
        versionCode 1
        versionName '1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    if (standaloneQa) {
        sourceSets.main {
            manifest.srcFile 'src/standalone/AndroidManifest.xml'
            java.setSrcDirs(['src/standalone/java'])
            res.setSrcDirs(['src/standalone/res'])
        }
    }
}
